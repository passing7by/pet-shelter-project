spring.application.name=pet-shelter-project


############################
server.port=80


############################ JSP 설정
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp


############################ MyBatis
# 유저네임
spring.datasource.hikari.username=pet_admin
spring.datasource.hikari.password=pet_admin

# log4jdbc 적용
# 이 부분은 나중에 운영 시 사용
#spring.datasource.url=jdbc:mysql://localhost:3306/user01
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:log4jdbc:mysql://localhost:3306/pet_shelter_project
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy

# mapper의 위치
#mybatis.mapper-locations=classpath:database/mappers/*Mapper.xml

# config의 위치
#mybatis.config-location=classpath:database/config/MybatisConfig.xml
# config파일에 Alias 작성하는 대신 여기에 등록 - 베이스패키지명으로 작성
# 패키지 내에 중복된 클래스명이 있는 경우에는 이렇게 사용 못함 - config파일에 작성하는 방식으로 해야 함
mybatis.type-aliases-package=com.shelter.app

# Snake case를 Camel Case로 변환
mybatis.configuration.map-underscore-to-camel-case=true

############################
## 1. message properties의 위치 설정
spring.messages.basename=message/message

## 2. Encoding 설정
spring.messages.encoding=UTF-8

## 3. key가 없는 경우 설정
spring.messages.use-code-as-default-message=true
# true: 키가 없을 경우 예외를 발생시키지 않고 key를 출력
# false: 예외 발생

# message 파일 내용의 변경을 감지하는 간격(초단위)
spring.messages.cache-duration=600